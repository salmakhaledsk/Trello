<div class="modal fade" id="addBoardModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 p-3">
      <div class="modal-body">
        <!-- TITLE -->
        <h5 class="fw-bold mb-4">Add New Board</h5>

        <!-- BOARD NAME -->
        <div class="mb-4">
          <label class="form-label fw-semibold small">Board Name</label>
          <input
            type="text"
            class="form-control"
            placeholder="e.g. Web Design"
            [ngModel]="boardName()"
            (ngModelChange)="boardName.set($event)"
            name="boardName"
          />
        </div>

        <!-- BOARD COLUMNS -->
        <div class="mb-4">
          <label class="form-label fw-semibold small mb-3">Columns</label>

          <div class="d-flex flex-column gap-3">
            @for (col of columns(); track $index) {
              <div class="d-flex gap-2">
                <input
                  type="text"
                  class="form-control"
                  placeholder="e.g. Todo"
                  [ngModel]="col"
                  (ngModelChange)="updateColumn($index, $event)"
                  [name]="'col-' + $index"
                />
                <button class="btn btn-light px-3" (click)="removeColumn($index)">x</button>
              </div>
            }
          </div>

          <!-- ADD COLUMN BUTTON -->
          <button
            class="btn btn-light w-100 rounded-pill mt-3 fw-semibold"
            (click)="addColumn()"
          >
            + Add New Column
          </button>
        </div>

        <!-- SAVE BUTTON -->
        <button
          class="btn w-100 rounded-pill py-2"
          style="background-color: #635FC7; color: #ffffff;"
          (click)="save()"
        >
          Create Board
        </button>
      </div>
    </div>
  </div>
</div>
