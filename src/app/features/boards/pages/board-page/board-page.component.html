@if (selectedBoard(); as board) {
  <div class="board-page d-flex gap-4 p-4 overflow-auto">
    @for (column of board.columns; track column.id) {
      <app-board-column
        [column]="column"
        [boardId]="board.id"
      ></app-board-column>
    }

    <div class="new-column-wrapper">
      <button
        class="new-column-btn"
        data-bs-toggle="modal"
        data-bs-target="#editBoardModal"
      >+ New Column</button>
    </div>
  </div>
} @else {
  <div class="empty-state">
    <p class="empty-state-text">This board is empty. Create a new column to get started.</p>
    <button
      class="empty-state-btn"
      data-bs-toggle="modal"
      data-bs-target="#addBoardModal"
    >
      + Create New Board
    </button>
  </div>
}

<app-view-task-modal></app-view-task-modal>

<app-edit-task-modal></app-edit-task-modal>
<app-delete-task-modal></app-delete-task-modal>
