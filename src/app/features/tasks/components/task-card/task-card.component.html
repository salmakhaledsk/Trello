<div
  class="task-card"
  draggable="true"
  data-bs-toggle="modal"
  data-bs-target="#viewTaskModal"
  (click)="openTask()"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd($event)"
>
  <h5>{{ task.title }}</h5>
  <p>
    {{ getCompletedCount() }} of {{ task.subtasks?.length ?? 0 }} subtasks
  </p>
</div>
