<header
  class="app-header d-flex align-items-center justify-content-between px-4"
>
  <div class="d-flex align-items-center gap-1">
    <button
      class="toggle-sidebar-btn btn p-0 d-flex align-items-center justify-content-center"
      type="button"
      (click)="toggleSidebar.emit()"
    >
      <img
        src="assets/images/eye-slash.1.png"
        alt="Show Sidebar"
        width="18"
        height="16"
      />
    </button>

    <h3 class="board-title mb-0 fw-bold">
      {{ selectedBoard()?.name }}
    </h3>
  </div>

  <div class="d-flex align-items-center gap-3">
    <button
      class="add-task-btn btn px-3 py-2 fw-semibold"
      data-bs-toggle="modal"
      data-bs-target="#addTaskModal"
      [disabled]="!selectedBoard()"
    >
      + Add New Task
    </button>

    <div class="dropdown">
      <button
        class="menu-btn btn p-0 d-flex align-items-center justify-content-center"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        [disabled]="!selectedBoard()"
      >
        <img src="assets/images/dots.png" alt="Menu" width="20" height="20" />
      </button>

      <ul class="dropdown-menu dropdown-menu-end custom-dropdown shadow mt-3">
        <li>
          <a
            class="dropdown-item custom-dropdown-item"
            href="#"
            data-bs-toggle="modal"
            data-bs-target="#editBoardModal"
          >
            Edit Board
          </a>
        </li>

        <li>
          <a
            class="dropdown-item custom-dropdown-item delete-item"
            href="#"
            data-bs-toggle="modal"
            data-bs-target="#deleteBoardModal"
          >
            Delete Board
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
